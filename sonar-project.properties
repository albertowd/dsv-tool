sonar.projectKey=dsv-tool
sonar.projectName=DSV Tool
sonar.sources=app
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Generated bundles, static assets and the Nuxt scaffold carry no reviewable
# source, and the `.css`/`.scss` files are pure styling.
sonar.exclusions=app/assets/**,**/*.css,**/*.scss

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
