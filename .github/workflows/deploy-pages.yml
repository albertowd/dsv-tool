# Builds the static site and publishes it to GitHub Pages.
#
# Requires Settings -> Pages -> Source set to "GitHub Actions" once; the
# workflow cannot enable that for you.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy step to publish, and to mint the OIDC token Pages wants.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. In-progress runs are allowed to
# finish so a half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Exposes `base_path`, the /<repo>/ prefix this site is served under.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Generate
        # A project site is served from /<repo>/, so the build needs that
        # prefix baked in. `base_path` already includes it.
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run generate

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
