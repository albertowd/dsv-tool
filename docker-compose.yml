# Local-only SonarQube for analysing this app during development.
# Not a deployment artifact: it binds to localhost, runs on the embedded
# database, and ships default credentials that `npm run sonar` rotates.
#
# Log in at http://localhost:9000 as  admin / P@ssw0rd1234
# (`npm run sonar:credentials` prints and verifies this; override with
# SONAR_PASSWORD before the first `npm run sonar`.)
name: dsv-tool-sonar

services:
  sonarqube:
    image: sonarqube:community
    ports:
      # Loopback only: this instance has no hardened credentials.
      - '127.0.0.1:9000:9000'
    environment:
      # No SONAR_JDBC_* on purpose: with no external database configured
      # SonarQube falls back to its embedded one, which is all a single
      # developer machine needs. It cannot be upgraded in place, so if a
      # SonarQube version bump ever refuses to boot, `npm run sonar:reset`.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # SonarQube embeds Elasticsearch, which wants a raised descriptor limit.
    # Its other demand, vm.max_map_count, is a host-wide kernel setting that
    # cannot be set per container, so the bootstrap check is waived above
    # rather than fought with; fine for a single-project dev instance.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  # Named explicitly so the scanner container can join it by a known name.
  default:
    name: dsv-tool-sonar
